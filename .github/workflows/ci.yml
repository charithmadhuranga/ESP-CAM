name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Pinned exactly per AGENTS rule 24 — matches platformio.ini.
  PLATFORMIO_PLATFORM: platformio/espressif32@8.0.0
  PLATFORMIO_FRAMEWORK: platformio/framework-espidf@4.60100.0

jobs:
  # ------------------------------------------------------------------
  # Web UI: syntax + API-contract unit tests, then Playwright E2E against
  # the mock device server (webui/tests/e2e-server.js)
  # ------------------------------------------------------------------
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies (ci)
        run: npm ci

      - name: Syntax check + unit tests
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

  # ------------------------------------------------------------------
  # Host test: AVI writer output validated with ffprobe/ffmpeg
  # ------------------------------------------------------------------
  avi-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build and validate AVI output
        run: test/host/run_avi_test.sh

  # ------------------------------------------------------------------
  # Firmware: configure + build with PlatformIO / ESP-IDF
  # ------------------------------------------------------------------
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO core + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pipx install platformio

      - name: Build firmware
        run: pio run -e esp32cam

      # The build above is the gate. Uploading the binaries is a convenience
      # and must not fail CI when the account's artifact quota is full.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: firmware-esp32cam
          path: |
            .pio/build/esp32cam/firmware.bin
            .pio/build/esp32cam/bootloader.bin
            .pio/build/esp32cam/partitions.bin
            .pio/build/esp32cam/firmware.elf
          retention-days: 7

  # ------------------------------------------------------------------
  # Embed-asset drift check (deferred until gzip determinism verified)
  # ------------------------------------------------------------------
  # See summary note: add an asset-regeneration drift check here only if
  # tools/embed_web_assets.py output is byte-deterministic across runs.
