; VisionCam Pro — PlatformIO project configuration
;
; Toolchain decisions are recorded in docs/adr/0001-toolchain.md.
; Every version below is pinned exactly (AGENTS rule 24 — no floating
; "latest" entries). Changing a pin requires a new ADR and a re-run of the
; Phase 0 camera smoke test.

[platformio]
; ESP-IDF's build system owns the source layout; PlatformIO's default src/
; is redirected to the VisionCam module tree (docs/adr/0001-toolchain.md).
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32cam

[env:esp32cam]
; platform 8.0.0 (published 2026-10-19) provides ESP-IDF 6.1.0 by default
; via framework-espidf ~4.60100.0 (a PATCH RANGE, not an exact pin — AGENTS
; rule 24 requires an exact one, so it is re-pinned below).
platform = platformio/espressif32@8.0.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.speed = 921600

; Exact ESP-IDF package pin. 4.60100.0 == IDF 6.1.0 (PlatformIO encodes the
; IDF version as <pkg>.<IDF Mmmpp>.<patch>); verified against
; framework-espidf/version.txt after the first successful build.
; Changing this requires a new ADR + a Phase 0 smoke-test re-run.
platform_packages =
    platformio/framework-espidf@4.60100.0
