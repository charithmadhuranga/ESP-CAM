; VisionCam Pro — PlatformIO project configuration
;
; Toolchain decisions are recorded in docs/adr/0001-toolchain.md.
; Every version below is pinned exactly (AGENTS rule 24 — no floating
; "latest" entries). Changing a pin requires a new ADR and a re-run of the
; Phase 0 camera smoke test.

[platformio]
; ESP-IDF's build system owns the source layout; PlatformIO's default src/
; is redirected to the VisionCam module tree (docs/adr/0001-toolchain.md).
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32cam

[env:esp32cam]
; platform 8.0.0 (published 2026-10-19) provides ESP-IDF 6.1.0 by default
; via framework-espidf ~4.60100.0 (a PATCH RANGE, not an exact pin — AGENTS
; rule 24 requires an exact one, so it is re-pinned below).
platform = platformio/espressif32@8.0.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.speed = 921600

; Exact ESP-IDF package pin. 4.60100.0 == IDF 6.1.0 (PlatformIO encodes the
; IDF version as <pkg>.<IDF Mmmpp>.<patch>); verified against
; framework-espidf/version.txt after the first successful build.
; Changing this requires a new ADR + a Phase 0 smoke-test re-run.
platform_packages =
    platformio/framework-espidf@4.60100.0

; Partition table for the PLATFORMIO/SCons pipeline.
;
; This is NOT redundant with CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in
; sdkconfig.defaults. There are two independent partition pipelines and they
; do not share a source of truth:
;
;   IDF/CMake   -> CONFIG_PARTITION_TABLE_CUSTOM_FILENAME -> flash_args
;                 (configure time; consumed by `idf.py flash`)
;   PlatformIO  -> board_build.partitions -> partitions.bin,
;                 ESP32_APP_OFFSET, ota_data_initial.bin
;                 (SCons build; consumed by `pio run -t upload`)
;
; PlatformIO defaults board_build.partitions to the framework's
; partitions_singleapp.csv when the board JSON omits it, which silently
; produced the OLD table (nvs 24K / phy 4K / factory 1M at 0x10000) while
; sdkconfig.h correctly reported the custom table. Left unfixed, `pio run
; -t upload` would have flashed the app at 0x10000 — inside our NVS region —
; and the device would not boot.
;
; Both pipelines must point at the same file. Verified 2026-11-15 by parsing
; .pio/build/esp32cam/partitions.bin after the change.
board_build.partitions = partitions.csv
