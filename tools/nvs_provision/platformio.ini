; tools/nvs_provision — Phase 0 D2 helper (docs/HARDWARE.md section 3.7)
;
; Writes VisionCam's Wi-Fi credentials into the ESP32 NVS so that R1
; (ESP32-CAM_MJPEG2SD, flashed *after* this tool) picks them up from its
; Preferences namespace and joins the owner's LAN. That lets the R1 baseline
; be measured over HTTP from this machine instead of a second device.
;
; Clean-room note (D1): this tool shares NO R1 code. It only writes two
; documented NVS keys ("ST_SSID", "ST_Pass") into R1's namespace
; ("ESP-CAM_MJPEG" = R1's APP_NAME), observed from the pinned source — the
; same effect as typing the credentials into R1's own setup page.
;
; Pins match the root project exactly (ADR-0001; AGENTS rule 24 — no
; floating versions).

[platformio]
src_dir = src
default_envs = esp32cam

[env:esp32cam]
platform = platformio/espressif32@8.0.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.speed = 921600
platform_packages =
    platformio/framework-espidf@4.60100.0

; Two partition pipelines, both must point at the same file (the trap
; documented in docs/adr/0001-toolchain.md): IDF/CMake reads
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME from sdkconfig.defaults, PlatformIO
; SCons reads board_build.partitions.
board_build.partitions = partitions.csv
