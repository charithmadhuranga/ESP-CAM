; tools/nvs_reset_auth — one-shot factory-credential reset (Phase 2).
;
; The board's stored password stopped matching the SPEC 4.2 default
; (admin/admin) during Phase 1's change-password testing, and the value was
; never recorded (AGENTS rule 17 keeps secrets out of docs). The owner
; authorised a reset to the factory default on 2026-11-18.
;
; WHY THIS TOOL EXISTS INSTEAD OF tools/nvs_provision: that helper boots with
; the Arduino-style 20 KB nvs table (0x9000 + 0x5000) while the firmware
; boots with 92 KB (0x9000 + 0x17000). Alternating two different views of the
; same NVS partition corrupted the page chain once already and cost the owner
; their Wi-Fi credentials (docs/REFERENCE_ANALYSIS.md, "Data-loss lesson").
; This tool therefore uses the ROOT partitions.csv — byte-identical nvs view
; to the firmware — so it sees exactly the pages the firmware sees.
;
; Workflow (same shape as tools/sd_format): flash it (it takes the ota_0
; slot, replacing the firmware), type ERASE at the prompt, then flash the
; firmware back. Never part of a release build.
;
; Clean-room note (D1): no R1 code. Pinned versions match the root project
; (ADR-0001; AGENTS rule 24 — no floating versions).

[platformio]
src_dir = src
default_envs = esp32cam

[env:esp32cam]
platform = platformio/espressif32@8.0.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.speed = 921600
platform_packages =
    platformio/framework-espidf@4.60100.0

; Two partition pipelines, both must point at the same file (the trap
; documented in docs/adr/0001-toolchain.md).
board_build.partitions = partitions.csv
