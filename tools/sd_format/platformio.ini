; tools/sd_format — one-shot SD card formatter (Phase 0, docs/HARDWARE.md 4.2)
;
; The owner's 8 GB SanDisk card ships with a bootable Linux Mint image (FAT
; boot/EFI + ext4 root). VisionCam can only mount FAT, so it saw a 5.0 MB
; volume next to an 8,053,063,680 B CSD. The owner instructed (2026-11-16)
; that the card be rewritten with a suitable file system and partition
; table. VisionCam itself NEVER formats a card (SPEC 2.3 keeps
; format_if_mount_failed = false forever), so the rewrite lives in this
; standalone tool: flash it, run `format`, confirm with the typed line
; ERASE, then flash the firmware back. Never part of a release build.
;
; Clean-room note (D1): no R1 code. The partition table and filesystem are
; produced by FatFs f_mkfs from the pinned ESP-IDF 6.1.0.
;
; Pins and versions match the root project exactly (ADR-0001; AGENTS rule
; 24 — no floating versions).

[platformio]
src_dir = src
default_envs = esp32cam

[env:esp32cam]
platform = platformio/espressif32@8.0.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.speed = 921600
platform_packages =
    platformio/framework-espidf@4.60100.0

; Two partition pipelines, both must point at the same file (the trap
; documented in docs/adr/0001-toolchain.md): IDF/CMake reads
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME from sdkconfig.defaults, PlatformIO
; SCons reads board_build.partitions.
board_build.partitions = partitions.csv
